name: Overfeel daily leads

on:
  schedule:
    - cron: "17 14 * * *"   # every day 14:17 UTC (22:17 Beijing)
  workflow_dispatch:
    inputs:
      count:
        description: "How many leads"
        default: "10"

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: leadgen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # remember which businesses were already checked, so we never pitch the same one twice
      - uses: actions/cache/restore@v4
        with:
          path: leadgen/data
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - name: Find leads & generate pages + emails
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py --count "${{ github.event.inputs.count || '10' }}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: leadgen/data
          key: seen-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: leadgen/output
          retention-days: 30
