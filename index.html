<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Email Link Test</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5a6475;
      --line: #d9dee8;
      --accent: #2563eb;
      --success: #0f8a5f;
      --bg: #f6f8fb;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    section {
      width: min(100%, 520px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 14px 34px rgba(23, 32, 51, 0.08);
    }

    .status {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--success);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .meta {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="status" aria-hidden="true">OK</div>
      <h1>Mobile email link opened successfully</h1>
      <p>This neutral test page confirms that a link from a mobile email client can open a public web page.</p>
      <p class="meta" id="meta">Loaded from GitHub Pages.</p>
    </section>
  </main>
  <script>
    const meta = document.getElementById("meta");
    meta.textContent = `Loaded from ${window.location.href}`;
  </script>
</body>
</html>
